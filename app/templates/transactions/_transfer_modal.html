<div class="modal fade" id="transferModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered txn-modal-dialog">
    <div class="modal-content txn-modal-content">

      <div class="txn-modal-header">
        <div class="txn-modal-header-left">
          <div class="txn-modal-icon" style="background:#f0f9ff;border-color:#bae6fd;color:#0284c7;">
            <i class="bi bi-arrow-left-right"></i>
          </div>
          <div>
            <h2 class="txn-modal-title">Переказ між рахунками</h2>
            <p class="txn-modal-subtitle">Не впливає на загальний баланс</p>
          </div>
        </div>
        <button type="button" class="txn-close-btn" data-bs-dismiss="modal" aria-label="Закрити">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <form id="transferForm" novalidate autocomplete="off">
        <div class="txn-modal-body">
          <div id="transferErrors" class="hidden rounded-3 border border-danger-subtle bg-danger-subtle px-3 py-2 text-danger small"></div>

          <div class="txn-field">
            <label class="txn-label">Сума (грн)</label>
            <input type="number" id="transferAmount" name="amount" min="0.01" step="0.01" required placeholder="Наприклад: 200.50" class="txn-input">
          </div>

          <div class="txn-field">
            <label class="txn-label">Рахунок-джерело</label>
            <select id="transferSourceAccountId" name="payment_account_id" required class="txn-select">
              <option value="">— Оберіть рахунок —</option>
            </select>
          </div>

          <div class="txn-field">
            <label class="txn-label">Рахунок-призначення</label>
            <select id="transferTargetAccountId" name="target_payment_account_id" required class="txn-select">
              <option value="">— Оберіть рахунок —</option>
            </select>
          </div>

          <div class="txn-field">
            <label class="txn-label">Коментар <span style="font-weight:400;text-transform:none;letter-spacing:0">(необов'язково)</span></label>
            <input type="text" id="transferComment" name="comment" placeholder="Опис переказу" class="txn-input">
          </div>

          <div class="txn-field">
            <label class="txn-label">Дата</label>
            <input type="date" id="transferDate" name="date" required class="txn-input">
          </div>
        </div>

        <div class="txn-modal-footer">
          <button type="button" data-bs-dismiss="modal" class="txn-btn txn-btn--ghost">Скасувати</button>
          <button type="submit" id="saveTransferBtn" class="txn-btn txn-btn--primary" style="background:#0284c7;">
            <i class="bi bi-arrow-left-right"></i>
            <span>Переказати</span>
          </button>
        </div>
      </form>

    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const openBtn = document.getElementById('openTransferModal');
  const modalEl = document.getElementById('transferModal');
  const form = document.getElementById('transferForm');
  const saveBtn = document.getElementById('saveTransferBtn');
  const saveBtnLabel = saveBtn ? saveBtn.querySelector('span') : null;
  const errorsEl = document.getElementById('transferErrors');
  const transferDate = document.getElementById('transferDate');
  const sourceSelect = document.getElementById('transferSourceAccountId');
  const targetSelect = document.getElementById('transferTargetAccountId');

  if (!openBtn || !modalEl || !form) return;

  const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  let paymentAccountsLoaded = false;

  async function loadPaymentAccounts() {
    if (paymentAccountsLoaded) return;
    try {
      const res = await fetch('/settings/payment_accounts');
      const accounts = await res.json();
      accounts.forEach(a => {
        [sourceSelect, targetSelect].forEach(select => {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = a.value;
          select.appendChild(opt);
        });
      });
      paymentAccountsLoaded = true;
    } catch (_) {}
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function setLoading(isLoading) {
    saveBtn.disabled = isLoading;
    if (saveBtnLabel) saveBtnLabel.textContent = isLoading ? 'Збереження...' : 'Переказати';
  }

  function showErrors(messages) {
    const list = Array.isArray(messages) ? messages : [messages];
    errorsEl.innerHTML = list.filter(Boolean).map(m => `<p class="leading-relaxed">${m}</p>`).join('');
    errorsEl.classList.remove('hidden');
  }

  function clearErrors() {
    errorsEl.innerHTML = '';
    errorsEl.classList.add('hidden');
  }

  openBtn.addEventListener('click', async function () {
    form.reset();
    clearErrors();
    setLoading(false);
    transferDate.value = todayISO();
    await loadPaymentAccounts();
    modal.show();
  });

  modalEl.addEventListener('hidden.bs.modal', function () {
    clearErrors();
    setLoading(false);
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearErrors();

    if (!sourceSelect.value) {
      showErrors('Оберіть рахунок-джерело');
      return;
    }
    if (!targetSelect.value) {
      showErrors('Оберіть рахунок-призначення');
      return;
    }
    if (sourceSelect.value === targetSelect.value) {
      showErrors('Рахунок-джерело і рахунок-призначення мають відрізнятись');
      return;
    }

    setLoading(true);

    const payload = {
      amount: document.getElementById('transferAmount').value,
      payment_account_id: sourceSelect.value,
      target_payment_account_id: targetSelect.value,
      comment: document.getElementById('transferComment').value,
      date: transferDate.value,
    };

    try {
      const res = await fetch('/transactions/transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        showErrors(data.errors || data.error || 'Помилка збереження');
        setLoading(false);
        return;
      }
      softReloadWithToast('Переказ збережено', 'success');
    } catch (err) {
      showErrors('Не вдалося зберегти. Спробуйте ще раз.');
      setLoading(false);
    }
  });
});
</script>
